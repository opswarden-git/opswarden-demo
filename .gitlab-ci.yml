image: node:24-bookworm-slim

stages:
  - test

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

typescript-contract:
  stage: test
  timeout: 5 minutes
  script:
    - npm ci
    - npm run check
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
